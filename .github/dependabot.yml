version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "automated"
    ignore:
      # Stay on the Node 22 LTS type definitions (engines.node >=22, CI runs Node 22).
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]
    groups:
      # Listed first so it wins over dev-dependencies. No update-types filter: vite and vitest
      # always bump together, majors included.
      vite-vitest:
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      prod-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
      - "automated"
