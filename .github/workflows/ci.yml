name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-gate:
    name: Review Gate (REVIEW.md)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enforce REVIEW.md gate
        run: node .github/scripts/review-gate.mjs

  verify:
    name: Static Checks, Assets, Unit Tests & Build
    runs-on: ubuntu-latest
    needs: [review-gate]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify Blender GLB assets & manifest
        run: npm run verify:assets

      - name: Unit & property tests
        run: npm run test:unit

      - name: Build (GitHub Pages BASE_PATH=/gubbas-porch/)
        env:
          BASE_PATH: /gubbas-porch/
        run: npm run build

      - name: Check bundle budgets
        run: npm run check:bundle

      - name: Build (Domain root BASE_PATH=/)
        env:
          BASE_PATH: /
        run: npm run build

  e2e:
    name: Browser E2E & 8-Bit Visual Verification
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Playwright verification (software WebGL)
        env:
          BASE_PATH: /gubbas-porch/
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/garden
        run: npx playwright test tests/e2e/garden.spec.ts

      # Eleven popular windows, from 1920x1080 down to phones: the whole garden and every control must stay on
      # screen, and an upright phone must be asked to turn sideways (DESIGN.md 2.4, D8).
      - name: Run popular-viewport responsiveness checks
        if: success() || failure()
        env:
          BASE_PATH: /gubbas-porch/
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/viewports
        run: npm run test:e2e:viewports

      # Mobile & touch gestures: tap vs hold-to-preview rake descriptions, haptics, Hoki sweep hold,
      # contextmenu suppression, 3-cell touch raking, 2-finger pinch/orbit, and touch stone placement.
      - name: Run mobile & touch controls checks
        if: success() || failure()
        env:
          BASE_PATH: /gubbas-porch/
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/touch
        run: npm run test:e2e:touch

      # Autonomous Gubba mode & 3D Watch: Gubba rakes choreography across all three variants.
      - name: Run autonomous Gubba mode checks
        if: success() || failure()
        env:
          BASE_PATH: /gubbas-porch/
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/auto
        run: npm run test:e2e:auto

      - name: Upload viewport & Gubba mode screenshots
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            test-results/viewport-*.png
            test-results/auto-*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
