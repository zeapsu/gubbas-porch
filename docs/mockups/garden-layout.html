<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rake Me — garden layout</title>
<style>
  html, body { margin: 0; padding: 0; background: none; }

  .rm * { box-sizing: border-box; }
  .stage { display: flex; justify-content: center; }
  .stage canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; outline: none; border-radius: 2px; }
  .stage canvas:focus-visible { outline: 2px solid var(--foreground, #e8e4dc); outline-offset: 2px; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0 0; }
  .bar .lbl { color: var(--muted-foreground, #a8a29a); margin-right: 2px; }
  .bar .sep { flex: 0 0 8px; }
  .rm button { font: inherit; color: inherit; cursor: pointer; padding: 3px 9px; border: 1px solid var(--border, #3d3a36); border-radius: var(--radius, 8px); background: var(--card, #1f1d1b); }
  .rm button[aria-pressed="true"] { border-color: var(--foreground, #e8e4dc); }
  .rm button:focus-visible { outline: 2px solid var(--foreground, #e8e4dc); outline-offset: 1px; }
  .tool { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 10px 0 0; padding: 10px; border: 1px solid var(--border, #3d3a36); border-radius: var(--radius, 8px); background: var(--card, #1f1d1b); }
  .tool canvas { flex: 0 0 auto; width: 224px; height: 80px; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 2px; }
  .tool .txt { flex: 1 1 260px; min-width: 0; }
  .tool h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
  .tool p { margin: 0; }
  .tool .spec { font-family: var(--font-mono, ui-monospace, monospace); font-size: 11px; color: var(--muted-foreground, #a8a29a); }
  .tool .line { margin-top: 4px; }
  .pal { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 0; }
  .pal .row { display: flex; flex: 1 1 300px; min-width: 0; height: 14px; }
  .pal .row i { flex: 1 1 0; min-width: 0; }
  .pal .row i.gap { margin-left: 3px; }
  .pal .lbl, .hint { color: var(--muted-foreground, #a8a29a); }
  .hint { margin: 8px 0 0; }
</style>
</head>

    for (let y = 0; y < GH; y++) { const f = front(y + 0.5); for (let x = 0; x < Math.min(GW, f - 2); x++) { const i = y * GW + x; if (!sand.rock[i]) { sand.ht[i] = 0; sand.dir[i] = UNRAKED; } } }
    if (u >= 1) { st.sweep = null; front = null; } }
  const fxo = { front, thread: st.breath ? br.amplitude * 2 * (GW + GH) : 0, glow: lit ? [166, 32] : null };
  const e = Math.max(0.75, 0.55 * (c.dist / r3.F) / Math.max(0.35, Math.sin(c.el)));
  r3.resolve(scr, {
    sky: (px, py, b) => { const v = py / H + (b - 0.5) * 0.12; return v < 0.1 ? S.sky0 : v < 0.2 ? S.sky1 : S.sky2; },
    sand: (x, z, b, sh) => sandSlot(sand, x + GW / 2, z + GH / 2, b, sh, L, e, fxo), floor: floorFx, wall: wallFx,
  });
  st.pick = r3;
  // sun or moon, only where the sky shows
  const sx = Math.round(W * 0.78), sy = Math.round(H * 0.07);
  for (let y = -4; y <= 4; y++) for (let x = -4; x <= 4; x++) if (x * x + y * y <= 14 && sy + y >= 0 && r3.mat[(sy + y) * W + sx + x] < 0) scr.px(sx + x, sy + y, st.mood === "moon" || st.mood === "mist" ? S.paper : S.warm2);
  // steam, petals, fireflies, motes: world points projected into the buffer
  const dot = (p, col) => { const q = r3.project(p); if (q && q[0] >= 0 && q[1] >= 0 && q[0] < W && q[1] < H && q[2] > r3.iz[(q[1] | 0) * W + (q[0] | 0)]) scr.px(q[0], q[1], col); };
  const f = Math.floor(ms / 420) % 3; for (const dy of [0, 2.2, 4.4]) dot([gub.steam[0] + ((f + dy) % 2 ? 0.7 : -0.5), gub.steam[1] + dy + f * 0.5, gub.steam[2]], S.paper);
  for (let i = 0; i < 12; i++) {
    const hx = (hash2(i, 1) % 300) - 120, hz = (hash2(i, 2) % 150) - 70, ph = (hash2(i, 3) % 628) / 100;
    if (st.mood === "dusk") dot([hx + Math.sin(t + ph) * 6 + t * 3 % 40, 70 - ((t * 7 + ph * 20) % 70), hz], i % 2 ? S.warm1 : S.warm2);
    if (st.mood === "moon" && i < 8 && Math.sin(t * 2.6 + ph) > 0.1) dot([hx + Math.sin(t / 4 + ph) * 10, 14 + (i % 4) * 6 + Math.cos(t / 3 + ph) * 3, hz], S.warm2);

  const hy0 = H - 35;
  icons.undo.blit(scr, 3, hy0); icons.redo.blit(scr, 19, hy0); lotusIcon(st.breath ? br.amplitude : 0).blit(scr, 35, hy0);
  icons.lantern.blit(scr, 3, hy0 + 17); icons.bell.blit(scr, 19, hy0 + 17); icons.scroll.blit(scr, 35, hy0 + 17);
  let text = null;
  if (st.hover && st.hover !== st.mute) text = RAKE[st.hover].tag; else if (st.say && now < st.say.until) text = st.say.text;
  if (text) {
    const sw = Math.min(172, W - 60), x0 = 55, lines = wrapText(text, sw - 14).slice(0, 3), y0 = H - 34;
    scr.rect(x0 + 2, y0 + 1, sw - 4, 30, S.paper); scr.hline(x0 + 2, x0 + sw - 3, y0 + 1, S.wood1); scr.hline(x0 + 2, x0 + sw - 3, y0 + 30, S.wood1);
    for (const x of [x0, x0 + sw - 2]) { scr.rect(x, y0, 2, 32, S.wood3); scr.vline(x + 1, y0, y0 + 31, S.wood2); scr.hline(x, x + 1, y0, S.ink); scr.hline(x, x + 1, y0 + 31, S.ink); }
    const ty = y0 + 3 + Math.floor((3 - lines.length) * 4.5);
    lines.forEach((ln, i) => drawText(scr, x0 + 6, ty + 1 + i * 9, ln, S.ink));
  }
  st.pal = currentPalette(now);
  img = present(scr, ctx, st.pal, img);
  window.__frameMs = (window.__frameMs || 0) * 0.9 + (performance.now() - now) * 0.1;
  requestAnimationFrame(frame);
}
function currentPalette(now) {
  const target = paletteRgb(st.mood, st.concept);
  if (!st.fade) return target;
  const step = Math.min(4, 1 + Math.floor((now - st.fade.t) / 500));
  if (step >= 4) { st.fade = null; return target; }
  return fadePalette(st.fade.from, target, step);
}

// ---------------------------------------------------------------- input: picking reads the part-id buffer; raking intersects the pointer ray with the sand plane
function fbPoint(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * r3.w, (e.clientY - r.top) / r.height * r3.h]; }
function sandHit(px, py) { if (!r3.cf || !r3.cp) return null; const d = r3.ray(px, py), cp = r3.cp; if (d[1] >= -1e-4) return null; const t = (SANDY - cp[1]) / d[1]; return [cp[0] + d[0] * t + GW / 2, cp[2] + d[2] * t + GH / 2]; }

function deflect(gx, gy) {                          // the head slides round stones instead of passing through them
  for (const s of sand.stones) { const nx = (gx - s.x) / (s.rx + 2.5), ny = (gy - s.y) / (s.ry + 2.5), q = Math.hypot(nx, ny); if (q < 1 && q > 1e-4) { gx = s.x + nx / q * (s.rx + 2.5); gy = s.y + ny / q * (s.ry + 2.5); } }

}
function nearestStone(x, y) { let best = null, bd = 40; for (const s of sand.stones) { const d = Math.hypot(x - s.x, y - s.y); if (d < bd) { bd = d; best = s; } } return best ? { cx: best.x, cy: best.y, r: Math.max(bd, (best.rx + best.ry) / 2 + 4) } : null; }
function selectRake(id) { const r = RAKE[id]; if (r.action === "sweep") st.sweep = performance.now(); else st.rake = id; speak(r.line); showTool(id); }
cv.addEventListener("pointermove", e => {
  const [px, py] = fbPoint(e), rake = RAKE[st.rake];
  if (st.drag) { st.goal.az = Math.max(-0.7, Math.min(0.7, st.drag.az - (e.clientX - st.drag.x) * 0.006)); st.goal.el = Math.max(0.25, Math.min(1.555, st.drag.el + (e.clientY - st.drag.y) * 0.006)); return; }
  const p = partAt(px, py), hit = sandHit(px, py), inGrid = hit && hit[0] >= 0 && hit[1] >= 0 && hit[0] < GW && hit[1] < GH;
  const wallRake = st.stroke ? null : rakeOfPart(p);
  st.hover = wallRake && (wallRake !== st.rake || RAKE[wallRake].action) ? wallRake : null; if (st.hover !== st.mute) st.mute = null;
  st.onSand = !!st.stroke || (inGrid && !st.hover && p < GB && p !== P_BASKET);
  cv.style.cursor = st.hover || p >= GB || p === P_BASKET ? "pointer" : st.onSand && !rake.action ? "none" : "grab";
  if (!hit || rake.action) return;
  let [gx, gy] = st.orbit ? hit : deflect(hit[0], hit[1]);
  if (st.stroke && st.orbit) {
    const o = st.orbit; let da = Math.atan2(gy - o.cy, gx - o.cx) - o.a; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
    const n = Math.max(1, Math.ceil(Math.abs(da) * o.r / 0.4));
    for (let k = 1; k <= n; k++) { const bb = o.a + da * k / n; sand.stamp(o.cx + o.r * Math.cos(bb), o.cy + o.r * Math.sin(bb), bb + Math.PI / 2, rake, 0, false); }
    o.a += da; st.head = [o.cx + o.r * Math.cos(o.a), o.cy + o.r * Math.sin(o.a)]; st.heading = o.a + (da >= 0 ? 1 : -1) * Math.PI / 2;
  } else if (st.stroke) { st.stroke.to(gx, gy); st.heading = st.stroke.heading; st.tail = [st.stroke.tx, st.stroke.ty]; st.head = [gx, gy]; }
  else if (st.onSand) {
    const Lh = rake.L; if (!st.tail) st.tail = [gx - Lh, gy];
    const dx = gx - st.tail[0], dy = gy - st.tail[1], dl = Math.hypot(dx, dy);
    if (dl > 1e-6) { st.tail = [gx - dx / dl * Lh, gy - dy / dl * Lh]; st.heading = Math.atan2(dy, dx); }

cv.addEventListener("pointerdown", e => {
  const [px, py] = fbPoint(e), p = partAt(px, py), rake = RAKE[st.rake], id = rakeOfPart(p), hit = sandHit(px, py);
  if (id && (id !== st.rake || RAKE[id].action)) { st.mute = id; st.hover = id; selectRake(id); return; }
  if (p >= GB) { speak(REFLECTIONS[reflIx++ % REFLECTIONS.length], 7000, true); return; }
  if (p === P_BASKET) { speak("Set a stone down and the sand has something to talk about."); showBasket(); return; }
  cv.setPointerCapture(e.pointerId);
  if (hit && hit[0] >= 0 && hit[1] >= 0 && hit[0] < GW && hit[1] < GH && !rake.action) {

    if (rake.orbit) { const o = nearestStone(gx, gy); if (o) { o.a = Math.atan2(gy - o.cy, gx - o.cx); o.r = Math.max(o.r, Math.hypot(gx - o.cx, gy - o.cy)); st.orbit = o; } }

    if (!st.orbit) st.stroke.to(gx + Math.cos(st.heading) * 0.01, gy + Math.sin(st.heading) * 0.01);

  } else { st.drag = { x: e.clientX, y: e.clientY, az: st.goal.az, el: st.goal.el }; cv.style.cursor = "grabbing"; }

const endStroke = () => { st.stroke = null; st.orbit = null; st.drag = null; };
cv.addEventListener("pointerup", endStroke); cv.addEventListener("pointercancel", endStroke);
cv.addEventListener("pointerleave", () => { if (!st.stroke) { st.hover = null; st.onSand = false; } });
cv.addEventListener("keydown", e => { const r = RAKES.find(r => r.key === e.key); if (r) { selectRake(r.id); e.preventDefault(); } });

// ---------------------------------------------------------------- legend
let pvImg = null, shown = "sugi";
function renderPreview(id) {                        // top-down stamp, lit by the same sand shader
  const PW = 112, PH = 40, s = new Sand(PW, PH), Lr = new Layer(PW, PH), r = RAKE[id], L = LIGHTS[st.mood][0];
  if (id === "wa") { s.setStones([{ x: 56, y: 20, rx: 4, ry: 3 }]); ringStroke(s, r, 56, 20, 13); }
  else if (id === "nagi") { runStroke(s, RAKE.sugi, [[-12, 10], [PW + 12, 10]], false); runStroke(s, RAKE.sugi, [[-12, 30], [PW + 12, 30]], false); runStroke(s, r, [[56, -12], [56, PH + 12]], false); }
  else if (id === "hoki") { runStroke(s, RAKE.sugi, [[-12, 10], [PW + 12, 10]], false); runStroke(s, RAKE.sugi, [[-12, 30], [PW + 12, 30]], false); for (let y = 0; y < PH; y++) { const f = 52 + 4 * Math.sin(Math.PI * y / PH); for (let x = 0; x < f - 2; x++) { s.ht[y * PW + x] = 0; s.dir[y * PW + x] = UNRAKED; } } }
  else if (id !== "basket") runStroke(s, r, [[-20, 20], [PW + 20, 20]], false);
  const fxo = { front: id === "hoki" ? gy => 52 + 4 * Math.sin(Math.PI * gy / PH) : null, thread: 0, glow: null };
  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) Lr.px(x, y, s.rock[y * PW + x] ? S.stone2 : sandSlot(s, x + 0.5, y + 0.5, BAYER4[(x & 3) + ((y & 3) << 2)], false, L, 0.75, fxo));
  if (id === "basket") drawText(Lr, 6, 15, "stones · lantern · moss · bonsai", S.ink);
  pvImg = present(Lr, pctx, paletteRgb(st.mood, st.concept), pvImg);
}
function showTool(id) {
  shown = id; const r = RAKE[id];
  el("t-name").textContent = r.key + " · " + r.name + " — " + r.tool;
  el("t-spec").textContent = r.spec + (r.L ? " · handle L " + r.L : "");
  el("t-role").textContent = r.look + ". " + r.role;
  el("t-line").textContent = "Gubba: “" + r.line + "”";
  renderPreview(id);
}
function showBasket() {
  shown = "basket";
  el("t-name").textContent = "P · Stone basket — placement mode";
  el("t-spec").textContent = "5 stones, lantern, bonsai, 2 moss islands, basin, pin · at most 12 per garden";
  el("t-role").textContent = "Woven bamboo, three stones showing. Opens a tray; elements snap to whole cells.";
  el("t-line").textContent = "Gubba: “Set a stone down and the sand has something to talk about.”";
  renderPreview("basket");
}
function renderSwatches() {
  const row = el("swatches"); row.textContent = "";
  paletteHex(st.mood, st.concept).forEach((hx, i) => { const s = document.createElement("i"); s.style.background = "#" + hx; s.title = i + " " + SLOT_NAMES[i] + " #" + hx; if ([5, 9, 13, 17, 20, 23, 26, 30].includes(i)) s.className = "gap"; row.append(s); });
  el("sw-label").textContent = "32 colours · " + MOODS[st.mood].name;
}
function setMood(m) {
  if (m === st.mood) return;
  st.fade = { from: st.pal || paletteRgb(st.mood, st.concept), t: performance.now() }; st.mood = m;
  document.querySelectorAll("[data-mood]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mood === m)));
  renderSwatches(); if (shown === "basket") showBasket(); else renderPreview(shown);
}
function group(attr, key, after) {
  document.querySelectorAll("[" + attr + "]").forEach(b => { const v = b.getAttribute(attr); b.setAttribute("aria-pressed", String(String(st[key]) === v));
    b.addEventListener("click", () => { st[key] = v === "true" ? true : v === "false" ? false : v; document.querySelectorAll("[" + attr + "]").forEach(o => o.setAttribute("aria-pressed", String(o === b))); if (after) after(v); }); });
}
function toggle(btn, key, after) { btn.addEventListener("click", () => { st[key] = !st[key]; btn.setAttribute("aria-pressed", String(st[key])); if (after) after(); }); btn.setAttribute("aria-pressed", String(st[key])); }
(function init() {
  const MOOD_SHORT = { mist: "Morning", cedar: "Afternoon", dusk: "Dusk", moon: "Moonlit" }, moods = el("moods");
  for (const m of MOOD_IDS) { const b = document.createElement("button"); b.type = "button"; b.dataset.mood = m; b.textContent = MOOD_SHORT[m]; b.title = MOODS[m].name; b.setAttribute("aria-pressed", String(m === st.mood)); b.addEventListener("click", () => setMood(m)); moods.append(b); }
  group("data-cam", "camName", v => { st.goal = JSON.parse(JSON.stringify(CAMS[v])); });
  group("data-chunky", "chunky", () => resize());
  group("data-concept", "concept", () => renderSwatches());
  toggle(el("b-breath"), "breath"); toggle(el("b-flow"), "flow");
  el("b-reset").addEventListener("click", () => { st.sweep = null; buildGarden(); });
  buildGarden(); resize(); renderSwatches(); showTool("sugi");
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv.parentElement); else window.addEventListener("resize", resize);
  const q = /[?&]cam=(\w+)/.exec(location.search); if (q && CAMS[q[1]]) { st.cam = JSON.parse(JSON.stringify(CAMS[q[1]])); st.goal = JSON.parse(JSON.stringify(CAMS[q[1]])); }
  speak("Take a rake. Any rake.", 6000);
