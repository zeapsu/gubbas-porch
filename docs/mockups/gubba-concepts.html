  gubWarts(body, [[14, 13.6, 5, 1.2], [20, 9, 6, 1.1], [-20, 12, 5, 1.2], [2, 14.5, 7, 1]], [S.gub1, S.gub2], GB + 3);
  // the shell: several sizes too small, a three-turn spire with a firefly window

  body.push(part(place(mkEll(1.3, 1.5, 0.8, 6, 4), { t: [11.4, sy + 4.7, 6.1] }), [st.glow ? S.warm2 : S.wood1], GB + 33, { cast: false }));
  const hy = 20.5 * b + a * 0.6, hx = -9;
  head.push(part(place(mkEll(12.6, 9.6, 11.6, 12, 8), { t: [hx, hy, 1.5] }), G, GB + 5));
  head.push(part(place(mkEll(13.3, 0.6, 11, 14, 4), { t: [hx, hy - 2.6, 2.5] }), [S.ink], GB + 6, { cast: false, line: false }));
  head.push(part(place(mkEll(1.5, 1, 1.3, 6, 4), { t: [hx + 6.5, hy - 3.5, 12] }), [S.warm1], GB + 7, { cast: false }));
  for (const sx of [-1, 1]) head.push(part(place(mkEll(1.7, 1.1, 0.9, 6, 4), { t: [hx + sx * 10.2, hy - 0.4, 7.6] }), [S.warm1], GB + 5, { cast: false, line: false }));
  for (const sx of [-1.4, 1.4]) head.push(part(place(mkEll(0.6, 0.6, 0.5, 5, 3), { t: [hx + sx, hy + 1, 12.9] }), [S.ink], GB + 5, { cast: false, line: false }));
  const sag = st.blink * 1.5;                                                                                                   // stalks sag when the eyes shut

  head.push(part(place(mkPrism(1.5, 1.2, 8.5 - sag, 6), { t: [hx + 5, hy + 8.4, 4] }), G, GB + 5));
  gubEye(head, [hx - 5, hy + 15.4 - sag, 4.6], 3.1, { id: GB + 10, droop: 1.2, blink: st.blink, px: 0.12 + (st.look || 0) * 0.2 });
  gubEye(head, [hx + 5, hy + 19 - sag, 4.6], 3.7, { id: GB + 14, droop: 0.7, blink: st.blink, px: -0.12 + (st.look || 0) * 0.2 });
  head.push(part(place(mkEll(12.4, 1.4, 11.2, 14, 4), { t: [hx, hy + 4.4, 1.6], rz: 0.12 }), [S.stone3, S.paper, S.paper], GB + 18));   // headband, askew
  head.push(part(place(mkEll(1.3, 1.3, 0.6, 6, 4), { t: [hx - 1, hy + 4.2, 12.3] }), [S.warm0], GB + 18, { cast: false, line: false }));
  head.push(part(place(mkBox(2.4, 2.4, 2), { t: [hx + 12.2, hy + 6, 2] }), [S.stone3, S.paper], GB + 19));
  head.push(part(place(mkBox(1, 5, 1.2), { t: [hx + 13.6, hy + 3, 3], rz: -0.3 }), [S.stone3, S.paper], GB + 19));
  head.push(part(place(mkBox(1, 4.4, 1.2), { t: [hx + 12, hy + 3, 0.6], rz: 0.15 }), [S.stone3, S.paper], GB + 19));
  rotYAbout(head, st.yaw || 0, [hx, 0, 0]);
  const arms = [];
  arms.push(part(place(mkEll(2.9, 2.3, 2.9, 7, 5), { t: [-19.5, 8 * b, 9.6] }), G, GB + 22));
  arms.push(part(place(mkEll(2.9, 2.3, 2.9, 7, 5), { t: [-1.5, 7.4 * b, 11.6] }), G, GB + 23));
  arms.push(part(place(mkBox(0.8, 11, 0.8), { t: [-21.5, 13 * b, 10.6], rz: 0.18 }), [S.wood1], GB + 24));                     // incense stick
  arms.push(part(place(mkEll(0.9, 0.9, 0.9, 5, 3), { t: [-22.5, 18.6 * b, 10.6] }), [S.warm1], GB + 24, { cast: false }));

const GUBBA3 = { A: gubba3A, B: gubba3B, C: gubba3C };
// move a built Gubba into the world: rotate about Y, then translate
function placeGubba(g, pos, yaw) {
  const c = Math.cos(yaw), s = Math.sin(yaw);
  for (const m of g.meshes) for (const arr of [m.p, m.n]) { if (!arr) continue; const isP = arr === m.p;
    for (let v = 0; v < arr.length; v += 3) { const x = arr[v], z = arr[v + 2]; arr[v] = x * c + z * s + (isP ? pos[0] : 0); arr[v + 2] = -x * s + z * c + (isP ? pos[2] : 0); if (isP) arr[v + 1] += pos[1]; } }
  const x = g.steam[0], z = g.steam[2]; g.steam = [x * c + z * s + pos[0], g.steam[1] + pos[1], -x * s + z * c + pos[2]];
  return g;
}

// ---------------------------------------------------------------- Gubba concept sheet, rendered in 3D
const CONCEPTS = [
  { id: "A", name: "A · Moss Yabba", vibe: "A hill of the garden that woke up, sat down, and stayed.",
    sil: "Wide front-on mound, no neck, curled tail", prop: "Crooked head bonsai, thimble teacup, a cushion far too small",
    face: "One big eye, one droopy; face-wide grin" },
  { id: "B", name: "B · Kasa Yabba", vibe: "A wandering monk who has been meaning to leave for a century.",
    sil: "Upright jowly pear, tail wrapped in front", prop: "Hat several sizes too small, sash too tight, tiny pipe",
    face: "One sleepy eye, one wide; curled whiskers" },
  { id: "C", name: "C · Lantern Yabba", vibe: "Dreamy, nocturnal, and the funkiest of the three.",
    sil: "Sideways sprawl, tail curling up and over", prop: "Too-small shell with a firefly window, headband askew",
    face: "Eyes on stubby stalks of different heights" },
];
const FB = 104, SCALE = 2, TH = 30;
const LIGHTS = { mist: [[-0.6, 0.6, 0.5], 0.44], cedar: [[-0.5, 0.8, 0.45], 0.32], dusk: [[0.65, 0.45, 0.45], 0.36], moon: [[-0.35, 0.75, -0.3], 0.46] };
let mood = "cedar", picked = null;
const FIXED_YAW = /[?&]yaw=([-\d.]+)/.test(location.search) ? parseFloat(RegExp.$1) : null;
const t0 = performance.now(), cards = [];

function floorFx(x, z, b, sh) {
  const board = Math.floor((z + 400) / 9), seam = (z + 400) % 9 < 1 || ((x + 400 + board * 23) % 46 < 1);
  let t = seam ? 1 : (hash2(Math.floor((x + 800) / 5), board) % 29 === 0 ? 3 : 2);
  if (sh) t = (b < 0.55) ? 0 : 1;
  return [S.wood0, S.wood1, S.wood2, S.wood3][t];
}
function renderGubba(r3, layer, id, st, yaw, cam) {
  const [L, amb] = LIGHTS[mood];
  r3.setCamera(cam.pos, cam.target, cam.fov); r3.setLight(L, amb); r3.center = [0, 14, 0]; r3.radius = 46; r3.begin();
  r3.add(part(place(mkBox(230, 1, 190), { t: [0, -0.5, -25] }), [S.wood2], 0, { kind: K_FLOOR, cast: false, line: false }));
  const g = placeGubba(GUBBA3[id](st), [0, 0, 0], yaw);
  for (const m of g.meshes) r3.add(m);
  r3.shadowPass();
  r3.resolve(layer, { sky: (px, py, b) => (py / r3.h + (b - 0.5) * 0.2 < 0.3 ? S.sky1 : S.sky2), floor: floorFx });
  return g;
}
const orbitCam = { pos: [0, 62, 142], target: [0, 15, 0], fov: 26 };

function build() {
  const grid = document.getElementById("grid");
  for (const c of CONCEPTS) {
    const card = document.createElement("div"); card.className = "card";
    const view = document.createElement("div"); view.className = "view";
    const cv = document.createElement("canvas"); cv.width = FB; cv.height = FB; cv.style.width = FB * SCALE + "px"; cv.style.height = FB * SCALE + "px";
    cv.setAttribute("aria-label", "3D 8-bit turntable render of Gubba concept " + c.name + ". Drag to turn.");
    const th = document.createElement("canvas"); th.width = TH * 3; th.height = TH; th.style.width = TH * 3 * SCALE + "px"; th.style.height = TH * SCALE + "px"; th.className = "thumbs";
    th.setAttribute("aria-label", "Silhouettes from the front, side and back");
    view.append(cv, th);
    const h = document.createElement("h3"); h.textContent = c.name;
    const v = document.createElement("p"); v.className = "vibe"; v.textContent = c.vibe;
    const sw = document.createElement("div"); sw.className = "sw";
    const dl = document.createElement("dl");
    for (const [k, val] of [["Shape", c.sil], ["Props", c.prop], ["Face", c.face]]) { const dt = document.createElement("dt"); dt.textContent = k; const dd = document.createElement("dd"); dd.textContent = val; dl.append(dt, dd); }
    const pick = document.createElement("button"); pick.type = "button"; pick.className = "pick"; pick.textContent = "Pick " + c.id;
    pick.addEventListener("click", () => { picked = picked === c.id ? null : c.id; refresh(); });
    const head = document.createElement("div"); head.className = "head"; head.append(h, pick);
    card.append(view, head, v, sw, dl); grid.append(card);
    const ctx = cv.getContext("2d"); ctx.imageSmoothingEnabled = false;
    const k = { c, card, cv, ctx, th, tctx: th.getContext("2d"), sw, pick, layer: new Layer(FB, FB), r3: new R3(FB, FB), img: null, yaw: 0.5, spin: true, drag: null };
    cv.addEventListener("pointerdown", e => { k.drag = { x: e.clientX, yaw: k.yaw }; k.spin = false; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener("pointermove", e => { if (k.drag) k.yaw = k.drag.yaw + (e.clientX - k.drag.x) * 0.02; });
    const up = () => { k.drag = null; }; cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
    cv.addEventListener("dblclick", () => { k.spin = true; });
    cards.push(k);
  }
  const bar = document.getElementById("moods");
  for (const m of MOOD_IDS) { const b = document.createElement("button"); b.type = "button"; b.textContent = MOODS[m].name; b.dataset.mood = m; b.addEventListener("click", () => { mood = m; refresh(); }); bar.append(b); }
  refresh(); requestAnimationFrame(frame);
}
function thumbs(k) {                               // front, side and back silhouettes
  const r3 = new R3(TH, TH), L = new Layer(TH, TH), all = new Layer(TH * 3, TH), cam = { pos: [0, 30, 150], target: [0, 18, 0], fov: 24 };
  [0, Math.PI / 2, Math.PI].forEach((yaw, n) => {
    renderGubba(r3, L, k.c.id, { amp: 0.4, blink: 0, yaw: 0, glow: false }, yaw, cam);
    for (let i = 0; i < TH * TH; i++) all.d[Math.floor(i / TH) * TH * 3 + n * TH + (i % TH)] = r3.part[i] >= GB ? S.ink : S.paper;
  });
  present(all, k.tctx, paletteRgb(mood, k.c.id));
}
function refresh() {
  document.querySelectorAll("#moods button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mood === mood)));
  for (const k of cards) {
    k.card.dataset.picked = String(picked === k.c.id); k.pick.setAttribute("aria-pressed", String(picked === k.c.id));
    k.pick.textContent = picked === k.c.id ? "Picked " + k.c.id : "Pick " + k.c.id;
    k.sw.textContent = "";
    GUBBA_PAL[k.c.id][mood].split(" ").forEach((hx, i) => { const s = document.createElement("span"), sw = document.createElement("i"); sw.style.background = "#" + hx; s.append(sw, document.createTextNode("#" + hx)); s.title = ["shade", "base", "light", "belly"][i]; k.sw.append(s); });
    thumbs(k);
  }
  document.getElementById("foot").textContent = "Real low-poly 3D drawn through the game's pixel pipeline (cel steps, Bayer dither, outlines, shadow). Drag a model to turn it. Silhouettes: front, side, back. B and C swatches outside Afternoon are provisional.";
}
function frame(now) {
  const ms = Math.max(0, now - t0);
  cards.forEach((k, i) => {
    if (FIXED_YAW !== null) k.yaw = FIXED_YAW; else if (k.spin) k.yaw = 0.5 * Math.sin(ms / 2600 + i * 0.7) + 0.2;
    const br = breath("4-4-6", ms + i * 900), bs = blinkState(ms, 11 + i * 5);
    const st = { amp: br.amplitude, blink: bs === "closed" ? 1 : bs === "half" ? 0.55 : 0, yaw: 0.18 * Math.sin(ms / 3100 + i), look: 0, glow: mood === "dusk" || mood === "moon" };
    const g = renderGubba(k.r3, k.layer, k.c.id, st, k.yaw, orbitCam);
    const p = k.r3.project(g.steam);
    if (p) { const f = Math.floor(ms / 420) % 3; for (const [dx, dy] of [[[0, 0], [1, -2], [0, -4]], [[1, 0], [0, -2], [1, -4]], [[0, -1], [1, -3], [0, -5]]][f]) k.layer.px(p[0] + dx, p[1] + dy - 1, S.paper); }
    k.img = present(k.layer, k.ctx, paletteRgb(mood, k.c.id), k.img);

  requestAnimationFrame(frame);

build();
